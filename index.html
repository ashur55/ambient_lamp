<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lamp Color Wheel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      gap: 20px;
      margin: 0;
    }
    input[type="color"] {
      width: 160px;
      height: 160px;
      border: none;
      background: none;
      cursor: pointer;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #2481cc;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>Pick Lamp Color</h3>
  <input type="color" id="picker" value="#ff7aa2" />
  <div id="hexLabel">#FF7AA2</div>
  <button id="sendBtn">Apply Color</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const picker = document.getElementById("picker");
    const label = document.getElementById("hexLabel");
    const btn = document.getElementById("sendBtn");

    picker.addEventListener("input", () => {
      label.textContent = picker.value.toUpperCase();
    });

    btn.addEventListener("click", () => {
      tg.sendData(picker.value.toUpperCase());
      tg.close();
    });
  </script>
</body>
</html>
